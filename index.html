<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>做到</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700&family=DM+Mono:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111110;
      --surface: #1c1c1a;
      --surface2: #242422;
      --text: #e8e6df;
      --muted: #6b6a65;
      --border: #2a2a28;
      --accent: #d4a853;
      --success: #6eb89a;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    #app {
      height: 100%;
      display: flex;
      flex-direction: column;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }

    .screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      padding: 28px 24px 44px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .screen.active {
      opacity: 1;
      pointer-events: all;
    }

    /* HEADER */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .app-name {
      font-family: 'Syne', sans-serif;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border: 1px solid var(--border);
      background: var(--surface);
      border-radius: 50%;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      line-height: 1;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-btn:active { transform: scale(0.9); background: var(--surface2); }

    /* MAIN SCREEN */
    #screen-main .content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .task-title-small {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.08em;
      margin-bottom: 28px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .progress-dots {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .progress-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--border);
      transition: background 0.3s;
    }

    .progress-dot.done { background: var(--success); }
    .progress-dot.current { background: var(--accent); }

    .step-counter {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      margin-bottom: 16px;
    }

    .step-text {
      font-family: 'DM Mono', monospace;
      font-size: clamp(17px, 4.5vw, 22px);
      font-weight: 300;
      line-height: 1.6;
      color: var(--text);
      margin-bottom: 14px;
      position: relative;
      transition: color 0.3s;
    }

    .step-text.completing {
      color: var(--muted);
    }

    .step-text.completing::after {
      content: '';
      position: absolute;
      left: 0;
      top: 50%;
      height: 1px;
      background: var(--success);
      animation: strikethrough 0.35s ease forwards;
    }

    @keyframes strikethrough {
      from { width: 0; }
      to { width: 100%; }
    }

    .step-time {
      font-size: 12px;
      color: var(--muted);
      font-style: italic;
    }

    /* EMPTY STATE */
    .empty-state {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      text-align: center;
    }

    .empty-symbol {
      font-size: 40px;
      opacity: 0.1;
    }

    .empty-state p {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.7;
    }

    /* CHECK BUTTON */
    .check-btn {
      width: 100%;
      height: 60px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 36px;
    }

    .check-btn:active:not(:disabled) {
      transform: scale(0.97);
      background: var(--surface2);
    }

    .check-btn:disabled { opacity: 0.5; cursor: default; }

    /* ADD TASK SCREEN */
    #screen-add .back-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      cursor: pointer;
      padding: 0;
      margin-bottom: 36px;
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-tap-highlight-color: transparent;
      letter-spacing: 0.05em;
    }

    #screen-add h2 {
      font-family: 'Syne', sans-serif;
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 36px;
      line-height: 1.25;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 10px;
      letter-spacing: 0.14em;
      color: var(--muted);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .field input,
    .field textarea {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 16px;
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
      resize: none;
    }

    .field input:focus,
    .field textarea:focus { border-color: var(--accent); }

    .field input[type="date"] { color-scheme: dark; }
    .field input::placeholder,
    .field textarea::placeholder { color: var(--muted); }

    .submit-btn {
      width: 100%;
      height: 56px;
      background: var(--accent);
      border: none;
      border-radius: 14px;
      color: #111110;
      font-family: 'Syne', sans-serif;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
      margin-top: 12px;
    }

    .submit-btn:active:not(:disabled) { transform: scale(0.97); opacity: 0.88; }
    .submit-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* LOADING SCREEN */
    #screen-loading {
      align-items: center;
      justify-content: center;
      gap: 24px;
    }

    .loading-dots {
      display: flex;
      gap: 8px;
    }

    .loading-dots span {
      width: 6px;
      height: 6px;
      background: var(--accent);
      border-radius: 50%;
      animation: dot 1.2s ease-in-out infinite;
    }

    .loading-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loading-dots span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes dot {
      0%, 60%, 100% { transform: translateY(0); opacity: 0.3; }
      30% { transform: translateY(-8px); opacity: 1; }
    }

    .loading-text {
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.08em;
    }

    /* COMPLETE SCREEN */
    #screen-complete {
      align-items: center;
      justify-content: center;
      text-align: center;
    }

    .complete-symbol {
      font-size: 56px;
      margin-bottom: 20px;
      animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      color: var(--success);
    }

    @keyframes pop {
      from { transform: scale(0); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }

    .complete-title {
      font-family: 'Syne', sans-serif;
      font-size: 32px;
      font-weight: 700;
      margin-bottom: 8px;
      color: var(--success);
    }

    .complete-task {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 48px;
      font-style: italic;
      max-width: 260px;
      line-height: 1.5;
    }

    .total-count {
      font-family: 'Syne', sans-serif;
      font-size: 52px;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      margin-bottom: 6px;
      animation: countup 0.4s ease 0.3s both;
    }

    @keyframes countup {
      from { transform: translateY(10px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .total-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .continue-btn {
      margin-top: 52px;
      background: none;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 13px 32px;
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.15s;
      -webkit-tap-highlight-color: transparent;
    }

    .continue-btn:active { background: var(--surface); }
  </style>
</head>
<body>
<div id="app">

  <!-- MAIN SCREEN -->
  <div class="screen active" id="screen-main">
    <div class="header">
      <span class="app-name">做到</span>
      <button class="icon-btn" onclick="showScreen('add')" aria-label="新增任務">+</button>
    </div>
    <div class="content" id="main-content"></div>
  </div>

  <!-- ADD TASK SCREEN -->
  <div class="screen" id="screen-add">
    <button class="back-btn" onclick="showScreen('main')">← 返回</button>
    <h2>新增任務</h2>
    <div class="field">
      <label>任務是什麼？</label>
      <textarea id="task-input" rows="3" placeholder="例如：家庭社會學期末報告"></textarea>
    </div>
    <div class="field">
      <label>截止日期（選填）</label>
      <input type="date" id="ddl-input">
    </div>
    <button class="submit-btn" id="submit-btn" onclick="submitTask()">讓 AI 幫我拆步驟</button>
  </div>

  <!-- LOADING SCREEN -->
  <div class="screen" id="screen-loading">
    <div class="loading-dots"><span></span><span></span><span></span></div>
    <p class="loading-text">正在拆解任務...</p>
  </div>

  <!-- COMPLETE SCREEN -->
  <div class="screen" id="screen-complete">
    <div class="complete-symbol">✓</div>
    <div class="complete-title">做完了</div>
    <div class="complete-task" id="complete-task-name"></div>
    <div class="total-count" id="total-count">0</div>
    <div class="total-label">總共完成的任務</div>
    <button class="continue-btn" onclick="showScreen('main')">繼續</button>
  </div>

</div>

<script>
  // ── STATE ──────────────────────────────────────────────
  let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');
  let completedCount = parseInt(localStorage.getItem('completedCount') || '0');
  let currentTaskId = localStorage.getItem('currentTaskId') || null;

  function save() {
    localStorage.setItem('tasks', JSON.stringify(tasks));
    localStorage.setItem('completedCount', String(completedCount));
    if (currentTaskId) localStorage.setItem('currentTaskId', currentTaskId);
    else localStorage.removeItem('currentTaskId');
  }

  function getCurrentTask() {
    if (currentTaskId) {
      const t = tasks.find(t => t.id === currentTaskId && !t.completed);
      if (t) return t;
    }
    return tasks.find(t => !t.completed) || null;
  }

  function getCurrentStep(task) {
    return task ? task.steps.find(s => !s.done) || null : null;
  }

  // ── SCREENS ────────────────────────────────────────────
  function showScreen(name) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    document.getElementById('screen-' + name).classList.add('active');
    if (name === 'main') renderMain();
  }

  // ── RENDER MAIN ────────────────────────────────────────
  function renderMain() {
    const task = getCurrentTask();
    const content = document.getElementById('main-content');

    if (!task) {
      content.innerHTML = `
        <div class="empty-state">
          <div class="empty-symbol">○</div>
          <p>什麼都沒有<br>按右上角的 + 新增任務</p>
        </div>`;
      return;
    }

    const step = getCurrentStep(task);
    if (!step) { completeTask(task); return; }

    const doneCount = task.steps.filter(s => s.done).length;
    const total = task.steps.length;
    const stepIndex = task.steps.indexOf(step);

    const dots = task.steps.map((s, i) => {
      let cls = 'progress-dot';
      if (s.done) cls += ' done';
      else if (i === stepIndex) cls += ' current';
      return `<div class="${cls}"></div>`;
    }).join('');

    content.innerHTML = `
      <div style="flex:1;display:flex;flex-direction:column;justify-content:center;">
        <div class="task-title-small">${task.title}</div>
        <div class="progress-dots">${dots}</div>
        <div class="step-counter">步驟 ${doneCount + 1} / ${total}</div>
        <div class="step-text" id="step-text">${step.text}</div>
        ${step.minutes ? `<div class="step-time">約 ${step.minutes} 分鐘</div>` : ''}
      </div>
      <button class="check-btn" id="check-btn" onclick="completeStep()">
        <span>✓</span><span>做完了這一步</span>
      </button>`;
  }

  // ── COMPLETE STEP ──────────────────────────────────────
  function completeStep() {
    const task = getCurrentTask();
    const step = getCurrentStep(task);
    if (!step) return;

    const btn = document.getElementById('check-btn');
    const stepEl = document.getElementById('step-text');
    if (btn) btn.disabled = true;
    if (stepEl) stepEl.classList.add('completing');

    setTimeout(() => {
      step.done = true;
      save();
      const next = getCurrentStep(task);
      if (!next) completeTask(task);
      else renderMain();
    }, 420);
  }

  // ── COMPLETE TASK ──────────────────────────────────────
  function completeTask(task) {
    task.completed = true;
    completedCount++;
    currentTaskId = null;
    save();

    document.getElementById('complete-task-name').textContent = task.title;
    document.getElementById('total-count').textContent = completedCount;
    showScreen('complete');
  }

  // ── SUBMIT TASK ────────────────────────────────────────
  async function submitTask() {
    const title = document.getElementById('task-input').value.trim();
    const ddl = document.getElementById('ddl-input').value;
    if (!title) return;

    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    showScreen('loading');

    try {
      const ddlText = ddl ? `截止日期：${ddl}` : '沒有截止日期';

      const response = await fetch('https://api.anthropic.com/v1/messages', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          model: 'claude-sonnet-4-20250514',
          max_tokens: 1000,
          system: '你是一個任務拆解助手，幫助有ADHD的人把任務拆成可執行的小步驟。每個步驟必須具體、可操作、5到15分鐘內可完成。第一步要特別簡單，降低啟動門檻。只回傳JSON陣列，不要其他文字。格式：[{"text":"步驟內容","minutes":數字}]',
          messages: [{
            role: 'user',
            content: `任務：${title}\n${ddlText}\n請拆解成最多12個步驟，用繁體中文。`
          }]
        })
      });

      const data = await response.json();
      const raw = data.content[0].text;
      const clean = raw.replace(/```json|```/g, '').trim();
      const steps = JSON.parse(clean);

      const task = {
        id: Date.now().toString(),
        title,
        ddl: ddl || null,
        steps: steps.map((s, i) => ({ id: i, text: s.text, minutes: s.minutes, done: false })),
        completed: false,
        createdAt: new Date().toISOString()
      };

      tasks.push(task);
      currentTaskId = task.id;
      save();

      document.getElementById('task-input').value = '';
      document.getElementById('ddl-input').value = '';
      btn.disabled = false;

      showScreen('main');

    } catch (err) {
      console.error(err);
      btn.disabled = false;
      alert('發生錯誤，請再試一次');
      showScreen('add');
    }
  }

  // ── INIT ───────────────────────────────────────────────
  renderMain();
</script>
</body>
</html>
